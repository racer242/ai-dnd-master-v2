history: |
  Малик родился в городе, где арена была центром общественной жизни. 
  Его огненная природа дженези сделала его идеальным гладиатором — 
  каждый бой сопровождался вспышками пламени и искрами, летящими из его кожи. 
  Толпа любила его за зрелищность и свирепость.

  Но Малик жил по одному правилу: он никогда не проигрывал дважды подряд. 
  Если его побеждали, следующий бой становился его последним словом — 
  он сражался с такой яростью, что противники бежали или гибли. 
  Эта репутация делала его одновременно популярным и опасным.

  Когда арена закрылась из-за политических интриг, Малик остался без работы. 
  Теперь он ищет новые вызовы — и новые способы доказать, что он непобедим.
