class_features:
  - name: "Favored Enemy (Humanoids)"
    description: "Вы получаете преимущество на проверки Выживания для отслеживания выбранных типов существ и бонус к урону против них."
  - name: "Natural Explorer (Forest)"
    description: "Вы получаете преимущества в путешествиях по лесу."
  - name: "Fighting Style (Dueling)"
    description: "+2 к урону одноручным оружием."
  - name: "Second Wind"
    description: "Бонусным действием восстанавливаете 1d10+уровень HP (1d10+1)."

racial_features:
  - name: "Darkvision"
    description: "Видение в темноте до 60 футов."
  - name: "Savage Attacks"
    description: "При критическом попадании добавляете дополнительный урон кубика."
  - name: "Rampage"
    description: "После убийства существа получаете +1 к атаке до конца хода."

equipment:
  - "Кожаный доспех"
  - "Короткий меч"
  - "Лук + 20 стрел"
  - "Набор охотника"
  - "Туристический набор"
  - "Карта местности"
  - "Палатка"
  - "Верёвка (50 футов)"
  - "Факелы (5)"
