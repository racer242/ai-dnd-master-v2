  cp: 0

trait: "Хитрый и выживающий, я доверяю лишь своим инстинктам."

history: |
  Зоран Охотник родился в клане гнолов, где выживание зависело от охоты и силы. С детства он обучался выслеживанию добычи, но его любопытство к миру за пределами клана привело к изгнанию. Теперь он скитается в одиночку, охотясь на зверей и путешествуя по диким землям, ищет новые территории и возможности доказать свою силу.
