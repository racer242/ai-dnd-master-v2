history: |
  Тини Винни Проныра родился в благополучной семье в крупном портовом городе. Его родители владели небольшим магазином, а он с детства учился искусству торговли и общения. Однажды, когда Тини был ещё подростком, в город пришли враждебные кланы, разграбили его дом и убили всю семью. Оставшись один на улицах, он быстро понял, что выживание зависит от ума и ловкости. 
  Тини стал вором, используя свои навыки обмана и убеждения, чтобы добывать еду и скрываться от стражи. Его цель — отомстить тем, кто уничтожил его семью, и вернуть себе утраченное благосостояние. Он ищет союзников, которые помогут ему в этом пути, но всегда остаётся осторожным и готовым к предательству.
